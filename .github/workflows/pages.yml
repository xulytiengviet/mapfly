name: Trien khai MapFly NeuroGIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
      - name: Kiem tra cu phap va cau hinh mien phi
        run: node tests/smoke.mjs
      - name: Cau hinh GitHub Pages
        uses: actions/configure-pages@v5
      - name: Dong goi trang web
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Trien khai website
        id: deployment
        uses: actions/deploy-pages@v4
